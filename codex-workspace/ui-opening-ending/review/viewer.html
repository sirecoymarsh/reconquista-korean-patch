<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>레콘퀴스타 UI 검토</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10151f;color:#e6ebf5;font:15px system-ui,sans-serif}header{padding:20px 24px;border-bottom:1px solid #344055;display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0 auto 0 0}select,button{font:inherit;padding:9px 12px;color:inherit;background:#253148;border:1px solid #51617e;border-radius:7px}button{cursor:pointer}main{padding:18px 22px 60px}p{color:#b3c1d7;line-height:1.6;margin:0 0 12px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pane{min-width:0}.bar{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.viewport{height:min(68vh,720px);min-height:300px;overflow:hidden;position:relative;border:1px solid #52617a;background:repeating-conic-gradient(#242934 0 25%,#202530 0 50%) 0/24px 24px;cursor:grab;touch-action:none}.viewport:active{cursor:grabbing}.viewport img{position:absolute;left:0;top:0;max-width:none;max-height:none;transform-origin:0 0;user-select:none;pointer-events:none}.badge{font-size:12px;color:#9cbbf8}footer{margin-top:20px;color:#9eacc1;line-height:1.7}.status{font-variant-numeric:tabular-nums;color:#a8c4ff}@media(max-width:850px){.compare{grid-template-columns:1fr}.viewport{height:45vh}}
</style>
<header><h1>레콘퀴스타 UI 검토</h1><select id="asset" aria-label="이미지 선택"></select><button id="fit">화면에 맞추기</button></header><main><p>이미지 위에서 마우스 휠로 확대·축소하고, 끌어서 이동하세요. 두 화면은 같은 위치를 보여줍니다. 더블클릭하면 처음 크기로 돌아갑니다.</p><div class="status" id="zoom" aria-live="polite">확대 100%</div><div class="compare"><section class="pane"><div class="bar"><b>원본</b><span class="badge">기준 이미지</span></div><div class="viewport" id="left"><img id="source" alt="원본 이미지" draggable="false"></div></section><section class="pane"><div class="bar"><b>한국어 후보</b><span class="badge" id="state"></span></div><div class="viewport" id="right"><img id="target" alt="한국어 후보 이미지" draggable="false"></div></section></div><footer>현재 한국어 비교 후보는 타이틀 메뉴 9개 상태입니다. 후보가 없는 항목은 원본을 표시합니다.<br>이미지 바깥에서는 일반 페이지 스크롤이 동작합니다. Ctrl/Meta+휠은 브라우저 확대를 유지합니다.</footer></main>
<script>
const panes=[...document.querySelectorAll('.viewport')],imgs=[document.querySelector('#source'),document.querySelector('#target')];let zoom=1,cx=.5,cy=.5,drag=null;const out=document.querySelector('#zoom');
function geo(p){const i=p.querySelector('img');return {w:p.clientWidth,h:p.clientHeight,nw:i.naturalWidth||800,nh:i.naturalHeight||600}}
function render(){for(const p of panes){const g=geo(p),s=Math.min(g.w/g.nw,g.h/g.nh)*zoom;p.querySelector('img').style.transform=`translate(${g.w/2-cx*g.nw*s}px,${g.h/2-cy*g.nh*s}px) scale(${s})`;p.dataset.zoom=zoom;p.dataset.centerX=cx;p.dataset.centerY=cy}out.textContent=`확대 ${Math.round(zoom*100)}% · 중심 ${(cx*100).toFixed(1)}%, ${(cy*100).toFixed(1)}%`}
function fit(){zoom=1;cx=cy=.5;render()}
for(const p of panes){p.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey)return;e.preventDefault();const g=geo(p),r=p.getBoundingClientRect(),x=e.clientX-r.left-p.clientLeft,y=e.clientY-r.top-p.clientTop,f=Math.min(g.w/g.nw,g.h/g.nh),s=f*zoom,px=cx+(x-g.w/2)/(g.nw*s),py=cy+(y-g.h/2)/(g.nh*s);zoom=Math.max(.15,Math.min(12,zoom*Math.exp(-e.deltaY*.0015)));cx=px-(x-g.w/2)/(g.nw*f*zoom);cy=py-(y-g.h/2)/(g.nh*f*zoom);render()},{passive:false});p.addEventListener('dblclick',fit);p.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,p,x:e.clientX,y:e.clientY,cx,cy};p.setPointerCapture(e.pointerId)});p.addEventListener('pointermove',e=>{if(!drag||drag.p!==p||drag.id!==e.pointerId)return;const g=geo(p),s=Math.min(g.w/g.nw,g.h/g.nh)*zoom;cx=drag.cx-(e.clientX-drag.x)/(g.nw*s);cy=drag.cy-(e.clientY-drag.y)/(g.nh*s);render()});p.addEventListener('pointerup',()=>drag=null);p.addEventListener('pointercancel',()=>drag=null)}
imgs.forEach(i=>i.addEventListener('load',render));new ResizeObserver(render).observe(document.querySelector('.compare'));document.querySelector('#fit').onclick=fit;
fetch('images.json').then(r=>r.json()).then(items=>{const select=document.querySelector('#asset');for(const a of items){const o=new Option((a.hasTarget?'● ':'')+a.id,a.id);select.add(o)}select.value='title1_off.rct';function show(){const a=items.find(x=>x.id===select.value);imgs[0].src=a.source;imgs[1].src=a.target;document.querySelector('#state').textContent=a.hasTarget?'한국어 후보 · 정적 검증 통과':'한국어 후보 준비 전';fit()}select.onchange=show;show()});
</script></html>
